<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iDowngrade</title>
    <style>
        :root {
            --bg-main: #020617;
            --bg-card: #0f172a;
            --border-color: #1e293b;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --bg-input: #1e293b;
            --border-input: #334155;
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --border-color: #cbd5e1;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --bg-input: #f8fafc;
            --border-input: #cbd5e1;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            position: relative;
            transition: background-color 0.3s, border-color 0.3s;
        }

        h2 { margin-top: 0; color: var(--text-primary); font-size: 1.6rem; text-align: center; font-weight: 600; }
        p { color: var(--text-secondary); font-size: 0.9rem; text-align: center; margin-bottom: 24px; }

        .step-header { position: relative; margin-bottom: 15px; text-align: center; }
        .back-btn { position: absolute; left: 0; top: 4px; background: var(--bg-input); color: var(--text-secondary); border: 1px solid var(--border-input); padding: 4px 12px; font-size: 0.8rem; border-radius: 8px; cursor: pointer; font-weight: 500; }
        .back-btn:hover { background: #334155; color: white; }

        .search-box { position: relative; margin-bottom: 20px; }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 1rem; pointer-events: none; }
        .search-input { width: 100%; box-sizing: border-box; padding: 14px 16px 14px 48px; background: var(--bg-input); border: 1px solid var(--border-input); border-radius: 12px; color: var(--text-primary); font-size: 1rem; outline: none; transition: border 0.2s; }
        .search-input:focus { border-color: #007aff; background: var(--bg-card); }

        .btn { background: #007aff; color: white; border: none; padding: 14px; width: 100%; border-radius: 12px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 10px; transition: background 0.2s; display: block; text-align: center; box-sizing: border-box; text-decoration: none; }
        .btn:hover { background: #0063cc; }
        .hidden { display: none !important; }

        .error-msg { color: #ef4444; font-size: 0.8rem; text-align: center; margin-top: 8px; font-weight: 500; min-height: 18px; }

        .theme-toggle-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: var(--bg-input);
            border: 1px solid var(--border-input);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all 0.2s;
            z-index: 10;
        }
        .theme-toggle-btn:hover { transform: scale(1.08); }
    </style>
</head>
<body>

    <div id="wizard-card" class="card">
        <button class="theme-toggle-btn" id="theme-btn" onclick="toggleTheme()">🌙</button>

        <!-- STEP 1: START SCREEN -->
        <div id="step-1">
            <h2 style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 0; color: var(--text-primary); font-size: 1.6rem; font-weight: 600; white-space: nowrap;">
                <svg xmlns="http://w3.org" viewBox="0 0 24 24" style="width: 34px; height: 34px; fill: currentColor; flex-shrink: 0; transform: translate(0px, -2px);">
                    <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35c-1.09-.46-2.09-.48-3.24 0c-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8c1.18-.24 2.31-.93 3.57-.84c1.51.12 2.65.72 3.4 1.8c-3.12 1.87-2.38 5.98.48 7.13c-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25c.29 2.58-2.34 4.5-3.74 4.25"/>
                </svg>
                <span>iDowngrade</span>
            </h2>
            <p>We help people to get old iOS unlike tethered ones!</p>
            <button class="btn" onclick="nextStep(2)">Start Downgrade!</button>
        </div>

        <!-- STEP 2: CHOOSE DEVICE TYPE -->
        <div id="step-2" class="hidden">
            <div class="step-header">
                <button class="back-btn" onclick="nextStep(1)">Back</button>
                <h2>Device Type</h2>
            </div>
            <p>Type iPhone, iPad, iPod Touch, or Mac</p>
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-type" class="search-input" placeholder="e.g. iPhone, iPad, Mac">
            </div>
            <div id="error-type" class="error-msg"></div>
            <button class="btn" onclick="confirmSelection('type')">Continue</button>
        </div>

        <!-- STEP 3: CHOOSE DEVICE MODEL -->
        <div id="step-3" class="hidden">
            <div class="step-header">
                <button class="back-btn" onclick="nextStep(2)">Back</button>
                <h2>Device Model</h2>
            </div>
            <p>Type out your specific hardware model generation</p>
            <div class="search-box">
                <span class="search-icon">📱</span>
                <input type="text" id="search-model" class="search-input" placeholder="e.g. iPhone 6, MacBook Pro">
            </div>
            <div id="error-model" class="error-msg"></div>
            <button class="btn" onclick="confirmSelection('model')">Continue</button>
        </div>

        <!-- STEP 4: CHOOSE VERSION TARGET -->
        <div id="step-4" class="hidden">
            <div class="step-header">
                <button class="back-btn" onclick="nextStep(3)">Back</button>
                <h2>Software Target</h2>
            </div>
            <p>Type the target version signature number or firmware title</p>
            <div class="search-box">
                <span class="search-icon">⚙️</span>
                <input type="text" id="search-version" class="search-input" placeholder="e.g. 6.1.3, Sonoma">
            </div>
            <div id="error-version" class="error-msg"></div>
            <button class="btn" onclick="confirmSelection('version')">Build Simulation</button>
        </div>

        <!-- STEP 5: SIMULATOR HUD VIEWPORT -->
        <div id="step-5" class="hidden">
            <h2 id="install-headline">Installation Progress</h2>
            <p id="target-title" style="font-family: monospace; background: #020617; padding: 6px; border-radius: 6px; text-align: center; color: #38bdf8; font-weight: 600;"></p>
            
            <div style="background: #020617; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; margin-top: 15px; height: 160px; overflow-y: auto;">
                <p id="install-status" style="margin: 0; color: #94a3b8; font-family: monospace; font-size: 0.82rem; line-height: 1.4; text-align: left; white-space: pre-line;"></p>
            </div>

            <button id="download-link" class="btn" style="display: none !important;" onclick="resetWizard()">Restart Simulation</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
